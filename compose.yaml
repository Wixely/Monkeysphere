services:
  monkeysphere:
    build:
      context: .
    ports:
      - "5080:8080"
    environment:
      MONKEYSPHERE_ADMIN_USERNAME: "${MONKEYSPHERE_ADMIN_USERNAME:-admin}"
      MONKEYSPHERE_ADMIN_PASSWORD: "${MONKEYSPHERE_ADMIN_PASSWORD:-admin}"
      DnaX__RemoteAccess__Enabled: "false"
      Monkeysphere__Backups__Frequency: "${MONKEYSPHERE_BACKUP_FREQUENCY:-Off}"
      Monkeysphere__Backups__Time: "${MONKEYSPHERE_BACKUP_TIME:-02:00}"
      Monkeysphere__Backups__DayOfWeek: "${MONKEYSPHERE_BACKUP_DAY_OF_WEEK:-Sunday}"
      Monkeysphere__Backups__DayOfMonth: "${MONKEYSPHERE_BACKUP_DAY_OF_MONTH:-1}"
      Monkeysphere__Backups__TimeZone: "${MONKEYSPHERE_BACKUP_TIME_ZONE:-UTC}"
      Monkeysphere__Backups__RetentionCount: "${MONKEYSPHERE_BACKUP_RETENTION_COUNT:-12}"
    volumes:
      - monkeysphere-data:/data
    restart: unless-stopped

volumes:
  monkeysphere-data:
